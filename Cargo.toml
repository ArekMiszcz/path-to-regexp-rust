[package]
name = "path_to_regexp"
version = "0.2.0"
homepage = "https://github.com/ArekMiszcz/path-to-regexp-rust"
repository = "https://github.com/ArekMiszcz/path-to-regexp-rust"
authors = ["Arkadiusz Miszczyszyn <arkadiusz.miszczyszyn@gmail.com>"]
edition = "2024"
rust-version = "1.85"
include = [
    "**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
description = "Turn a path string such as `/user/:name` into a regular expression"
license = "MIT"

[dependencies]
fancy-regex = "0.18"
regex = "1.13"
